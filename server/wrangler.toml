# Worker de l'API du compte Hangar. Deux environnements séparés, chacun avec sa base Turso :
#   prod : l'app publiée        (npm run deploy:prod)
#   test : Hangar Test          (npm run deploy:test, et npm run dev en local)
# Les secrets (TURSO_URL, TURSO_TOKEN, AUTH_SECRET, SECRETS_KEY, clés OAuth, RESEND_API_KEY)
# ne sont jamais ici : `wrangler secret put <NOM> --env <prod|test>` (voir README.md).
name = "hangar-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
# Pas de télémétrie de l'outil.
send_metrics = false

[env.prod]
name = "hangar-api"
workers_dev = false
routes = [{ pattern = "hangar-api.pamalstudio.fr", custom_domain = true }]
vars = { BASE_URL = "https://hangar-api.pamalstudio.fr", MAIL_FROM = "Hangar <connexion@pamalstudio.fr>" }
# Avatars du profil (privés : servis seulement par l'API).
r2_buckets = [{ binding = "AVATARS", bucket_name = "hangar-avatars" }]

# En local (npm run dev), .dev.vars remplace BASE_URL par http://127.0.0.1:8787.
[env.test]
name = "hangar-api-test"
workers_dev = false
routes = [{ pattern = "hangar-api-test.pamalstudio.fr", custom_domain = true }]
vars = { BASE_URL = "https://hangar-api-test.pamalstudio.fr", MAIL_FROM = "Hangar Test <connexion@pamalstudio.fr>" }
r2_buckets = [{ binding = "AVATARS", bucket_name = "hangar-avatars-test" }]
