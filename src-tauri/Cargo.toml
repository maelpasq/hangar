[package]
name = "hangar"
version = "1.2.18"
description = "Hangar - bibliothèque de jeux unifiée"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha1_smol = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
base64 = "0.22"
sha1_smol = "1"
zip = { version = "9.5", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
rusqlite = { version = "0.37", features = ["bundled"] }
# Jetons des comptes : coffre du système (Gestionnaire d'identification Windows, Trousseau macOS,
# Secret Service sous Linux : KWallet ou GNOME Keyring).
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
plist = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Storage_FileSystem"] }
png = "0.17"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "abort"

# glib 0.18 (imposé par Tauri) avec le correctif de RUSTSEC-2024-0429, voir patches/README.md.
[patch.crates-io]
glib = { path = "../patches/glib" }
