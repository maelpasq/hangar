[package]
name = "hangar-setup"
version = "1.2.18"
description = "Installeur de Hangar"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
panic = "abort"

# glib 0.18 (imposé par Tauri) avec le correctif de RUSTSEC-2024-0429, voir patches/README.md.
[patch.crates-io]
glib = { path = "../patches/glib" }
