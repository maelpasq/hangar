name: Bug
description: Quelque chose ne marche pas comme prévu dans Hangar.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler un problème. Une faille de sécurité ne va pas ici : utilise l'onglet **Security** du dépôt (signalement privé).
        Ne colle jamais de clé d'API, de jeton ou de chemin qui contient ton nom d'utilisateur.
  - type: textarea
    id: probleme
    attributes:
      label: Le problème
      description: Ce qui se passe, et ce que tu attendais à la place.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Pour le reproduire
      placeholder: |
        1. Ouvrir...
        2. Cliquer sur...
        3. Voir...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version de Hangar
      description: Paramètres > Général > Mise à jour.
      placeholder: "1.2.2"
    validations:
      required: true
  - type: dropdown
    id: systeme
    attributes:
      label: Système
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
    validations:
      required: true
  - type: dropdown
    id: launcher
    attributes:
      label: Launcher concerné
      multiple: true
      options:
        - Aucun en particulier
        - Steam
        - Epic Games
        - GOG
        - Ubisoft Connect
        - EA app
        - Battle.net
        - Riot Games
        - Xbox / Microsoft Store
        - Jeux locaux ou ajoutés à la main
        - Jeux web
  - type: textarea
    id: details
    attributes:
      label: Captures ou détails
      description: Une capture d'écran aide beaucoup. Vérifie qu'elle ne montre rien de personnel.
