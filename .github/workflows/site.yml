name: site
# Site de téléchargement (site/index.html) publié sur GitHub Pages.
# Les images, la police et le logo sont repris du dépôt au déploiement : une seule source.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/images/**', 'installer/ui/wordmark.png', 'installer/ui/fonts/**', 'public/favicon.svg', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: assembler le site
        run: |
          mkdir -p _site/fonts _site/images
          cp site/index.html _site/
          cp public/favicon.svg _site/
          cp installer/ui/wordmark.png _site/
          cp installer/ui/fonts/geist-latin-wght-normal.woff2 _site/fonts/
          cp docs/images/*.webp _site/images/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
