name: build
# Branches seulement : un tag de version est déjà construit par release.yml.
on:
  push:
    branches: ['**']
  workflow_dispatch:
# Lecture seule : ce workflow ne publie rien.
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel] # Intel : les Mac arm64 de GitHub sont souvent saturés
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, components: clippy }
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build
      # Les erreurs sont aussi publiées en annotations (lisibles sans être connecté).
      - name: cargo test
        env: { CARGO_TERM_COLOR: never } # sans codes ANSI, pour les annotations
        working-directory: src-tauri
        shell: bash
        run: |
          set +e # le bash de GitHub sort au premier échec : publier d'abord les erreurs
          cargo test --no-fail-fast 2>&1 | tee test.log; s=${PIPESTATUS[0]}
          grep -E "^test .* FAILED|panicked at|^error" test.log | sed 's/^/::error::/' || true
          exit $s
      - name: cargo clippy
        env: { CARGO_TERM_COLOR: never } # sans codes ANSI, pour les annotations
        if: success() || failure()
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.log; s=${PIPESTATUS[0]}
          grep -E -A1 "^error" clippy.log | grep -v "^--" | paste - - | sed 's/^/::error::/' || true
          exit $s
      - name: installeur Hangar
        if: runner.os == 'Windows'
        working-directory: installer
        run: |
          cargo test --release
          cargo clippy --release --all-targets -- -D warnings
          cargo build --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hangar-${{ runner.os }}
          path: |
            src-tauri/target/release/hangar.exe
            src-tauri/target/release/bundle/nsis/*.exe
            installer/target/release/hangar-setup.exe
            src-tauri/target/release/bundle/dmg/*.dmg
