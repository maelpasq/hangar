name: build
# Branches seulement : un tag de version est déjà construit par release.yml.
on:
  push:
    branches: ['**']
  workflow_dispatch:
# Lecture seule : ce workflow ne publie rien.
permissions:
  contents: read
# Un nouveau push annule le build encore en cours sur la même branche.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          # Intel : les Mac arm64 de GitHub sont souvent saturés. Universel comme release.yml,
          # pour que le cache Rust de main serve tel quel à la release.
          - os: macos-15-intel
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
          targets: ${{ matrix.os == 'macos-15-intel' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      # Dépendances Rust déjà compilées : enregistré seulement sur main, relu par
      # release.yml (un tag peut lire le cache de la branche par défaut).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release
          workspaces: |
            src-tauri -> target
            installer -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - name: npm run build
        env: { CARGO_TERM_COLOR: never } # sans codes ANSI, pour les annotations
        shell: bash
        run: |
          set +e
          npm run build -- ${{ matrix.args }} 2>&1 | tee build.log; s=${PIPESTATUS[0]}
          grep -E -A3 "^error" build.log | grep -v "^--" | paste - - - - | sed 's/^/::error::/' || true
          exit $s
      # Les erreurs sont aussi publiées en annotations (lisibles sans être connecté).
      - name: cargo test
        env: { CARGO_TERM_COLOR: never } # sans codes ANSI, pour les annotations
        working-directory: src-tauri
        shell: bash
        run: |
          set +e # le bash de GitHub sort au premier échec : publier d'abord les erreurs
          cargo test --no-fail-fast 2>&1 | tee test.log; s=${PIPESTATUS[0]}
          grep -E "^test .* FAILED|panicked at|^error" test.log | sed 's/^/::error::/' || true
          exit $s
      - name: cargo clippy
        env: { CARGO_TERM_COLOR: never } # sans codes ANSI, pour les annotations
        if: success() || failure()
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.log; s=${PIPESTATUS[0]}
          grep -E -A1 "^error" clippy.log | grep -v "^--" | paste - - | sed 's/^/::error::/' || true
          exit $s
      - name: installeur Hangar
        if: runner.os == 'Windows'
        working-directory: installer
        run: |
          cargo test --release
          cargo clippy --release --all-targets -- -D warnings
          cargo build --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hangar-${{ runner.os }}
          path: |
            src-tauri/target/release/hangar.exe
            src-tauri/target/release/bundle/nsis/*.exe
            installer/target/release/hangar-setup.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
