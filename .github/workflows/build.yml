name: build
# Branches seulement : un tag de version est déjà construit par release.yml.
# Pas de build pour un push qui ne touche que la documentation.
on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', 'site/**', '.github/workflows/site.yml', '**/*.md', 'LICENSE', '.claude/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
# Lecture seule : ce workflow ne publie rien.
permissions:
  contents: read
# Un nouveau push annule le build encore en cours sur la même branche.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Le commit « Version x.y.z » est construit par release.yml (son tag) : pas de doublon.
    if: ${{ !startsWith(github.event.head_commit.message, 'Version ') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          # Intel : les Mac arm64 de GitHub sont souvent saturés. Universel comme release.yml,
          # pour que le cache Rust de main serve tel quel à la release. Pas de .dmg ici
          # (seule la release en a besoin, et sa création échoue parfois sur ces Mac).
          - os: macos-15-intel
            args: '--target universal-apple-darwin --bundles app'
          # Linux (AppImage) : Ubuntu 22.04 pour une glibc ancienne, l'AppImage tourne sur les distributions récentes (CachyOS, Arch...).
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
          targets: ${{ matrix.os == 'macos-15-intel' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      # Dépendances Rust déjà compilées : enregistré seulement sur main, relu par
      # release.yml (un tag peut lire le cache de la branche par défaut).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release
          workspaces: |
            src-tauri -> target
            installer -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Dépendances compilées gardées même si une étape suivante échoue.
          cache-on-failure: true
      # Linux : bibliothèques de Tauri (WebKitGTK, zone de notification) et D-Bus (coffre des comptes).
      - name: Linux, dépendances
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - name: npm run build
        env: { CARGO_TERM_COLOR: never } # sans codes ANSI, pour les annotations
        shell: bash
        run: |
          set +e
          npm run build -- ${{ matrix.args }} 2>&1 | tee build.log; s=${PIPESTATUS[0]}
          grep -E -A3 "^error" build.log | grep -v "^--" | paste - - - - | sed 's/^/::error::/' || true
          grep -iE "failed to bundle|^\s*Error " build.log | head -5 | sed 's/^/::error::/' || true
          exit $s
      # Les erreurs sont aussi publiées en annotations (lisibles sans être connecté).
      - name: cargo test
        env: { CARGO_TERM_COLOR: never } # sans codes ANSI, pour les annotations
        working-directory: src-tauri
        shell: bash
        run: |
          set +e # le bash de GitHub sort au premier échec : publier d'abord les erreurs
          cargo test --no-fail-fast 2>&1 | tee test.log; s=${PIPESTATUS[0]}
          grep -E "^test .* FAILED|panicked at|^error" test.log | sed 's/^/::error::/' || true
          exit $s
      - name: cargo clippy
        env: { CARGO_TERM_COLOR: never } # sans codes ANSI, pour les annotations
        if: success() || failure()
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.log; s=${PIPESTATUS[0]}
          grep -E -A1 "^error" clippy.log | grep -v "^--" | paste - - | sed 's/^/::error::/' || true
          exit $s
      - name: installeur Hangar
        if: runner.os == 'Windows'
        working-directory: installer
        run: |
          cargo test --release
          cargo clippy --release --all-targets -- -D warnings
          cargo build --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hangar-${{ runner.os }}
          path: |
            src-tauri/target/release/hangar.exe
            src-tauri/target/release/bundle/nsis/*.exe
            installer/target/release/hangar-setup.exe
            src-tauri/target/universal-apple-darwin/release/bundle/macos/
            src-tauri/target/release/bundle/appimage/*.AppImage
