name: build
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: npm install
      - run: npm run check
      - run: npm run test
      - run: npm run build
      # Les erreurs sont aussi publiées en annotations (lisibles sans être connecté).
      - name: cargo test
        env: { CARGO_TERM_COLOR: never } # sans codes ANSI, pour les annotations
        working-directory: src-tauri
        shell: bash
        run: |
          cargo test --no-fail-fast 2>&1 | tee test.log; s=${PIPESTATUS[0]}
          grep -E "^test .* FAILED|panicked at|^error" test.log | sed 's/^/::error::/' || true
          exit $s
      - name: cargo clippy
        env: { CARGO_TERM_COLOR: never } # sans codes ANSI, pour les annotations
        if: success() || failure()
        working-directory: src-tauri
        shell: bash
        run: |
          cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.log; s=${PIPESTATUS[0]}
          grep -E -A1 "^error" clippy.log | grep -v "^--" | paste - - | sed 's/^/::error::/' || true
          exit $s
      - uses: actions/upload-artifact@v4
        with:
          name: hangar-${{ runner.os }}
          path: |
            src-tauri/target/release/hangar.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
