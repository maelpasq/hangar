# Publie une version : `npm version patch` puis `git push --follow-tags` (voir docs/RELEASES.md).
# Construit Windows (installeur NSIS), macOS (dmg universel Intel + Apple Silicon) et Linux (AppImage),
# les attache à la release GitHub et génère latest.json, lu par le bouton « Mettre à jour ».
# Actions épinglées par commit (pas par tag déplaçable) : elles voient la clé de signature.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-15-intel # Intel : les Mac arm64 de GitHub sont souvent saturés ; l'app reste universelle
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04 # glibc ancienne : l'AppImage tourne sur les distributions récentes
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-15-intel' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      # Dépendances Rust déjà compilées : cache rempli par build.yml sur main (même profil
      # release, mêmes cibles), seulement lu ici. Seul le code de Hangar est recompilé.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release
          workspaces: |
            src-tauri -> target
            installer -> target
          save-if: false
      # Linux : bibliothèques de Tauri (WebKitGTK, zone de notification) et D-Bus (coffre des comptes).
      - name: Linux, dépendances
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf
      # Sans scripts d'installation : aucune dépendance npm n'en a besoin, et c'est la porte
      # d'entrée habituelle d'un paquet piégé.
      - run: npm ci --ignore-scripts
      # Frontend compilé ici, sans aucun secret : vite et ses plugins ne voient jamais la clé de
      # signature des mises à jour. tauri-action ne le recompile pas (tauri.prebuilt.conf.json).
      - name: frontend (sans secrets)
        run: npm run build:web
      # Notes de la release : la section de cette version dans docs/RELEASES.md.
      - name: notes de version
        id: notes
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          notes=$(awk -v h="### $v " 'index($0, h) == 1 { f = 1; next } /^### / { f = 0 } f' docs/RELEASES.md | sed '/^$/d')
          {
            echo 'body<<FIN_DES_NOTES'
            if [ -n "$notes" ]; then printf '%s\n\n' "$notes"; fi
            echo 'Télécharge **Hangar-Setup.exe** (Windows), ou le **.dmg** (macOS) ci-dessous. La version Linux est en pause (en cours de refonte). Les versions déjà installées se mettent à jour depuis Hangar.'
            echo 'FIN_DES_NOTES'
          } >> "$GITHUB_OUTPUT"
      # macOS : la création du .dmg échoue parfois (« hdiutil: couldn't eject - Resource busy ») :
      # Spotlight et XProtect gardent l'image disque ouverte. On les coupe, et on refait un essai.
      - name: macOS, préparer hdiutil
        if: runner.os == 'macOS'
        run: |
          sudo mdutil -a -i off || true
          sudo pkill -9 XProtect || true
      - id: build
        continue-on-error: ${{ runner.os == 'macOS' }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          HANGAR_BUG_WEBHOOK: ${{ secrets.HANGAR_BUG_WEBHOOK }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Hangar ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.prebuilt.conf.json
      # Second essai si le .dmg a échoué : l'app est déjà compilée, seul l'empaquetage est refait.
      - name: macOS, nouvel essai
        if: steps.build.outcome == 'failure'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          HANGAR_BUG_WEBHOOK: ${{ secrets.HANGAR_BUG_WEBHOOK }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Hangar ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.prebuilt.conf.json
      # Installeur Hangar : embarque le NSIS (toujours utilisé par l'updater), nom stable pour un lien direct.
      - name: installeur Hangar
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }} # par l'environnement, jamais collé dans le script
        run: |
          npm run build:setup
          cp installer/target/release/hangar-setup.exe Hangar-Setup.exe
          gh release upload "$TAG" Hangar-Setup.exe --clobber
      # Jars de Hangar MC : sur le dépôt maelpasq/hangar-mc (release du même tag), pour ne pas
      # encombrer la page des releases de Hangar. MC_TOKEN : jeton limité à ce dépôt (Contents en écriture).
      # Rien tant que Mojang n'a pas validé Hangar MC (APPROVED dans accounts/microsoft.rs).
      - name: jars Hangar MC
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MC_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          grep -q 'APPROVED: bool = true' src-tauri/src/accounts/microsoft.rs || { echo "Hangar MC pas encore validé : jars non publiés"; exit 0; }
          r=maelpasq/hangar-mc; t="$TAG"; jars=(src-tauri/resources/mods/hangarmc-*.jar)
          gh release create "$t" "${jars[@]}" --repo $r --title "Hangar MC $t" --notes "Mod Hangar MC de Hangar $t, téléchargé par l'app." \
            || gh release upload "$t" "${jars[@]}" --repo $r --clobber
