# Publie une version : `npm version patch` (ou minor/major) puis `git push --follow-tags`.
# Construit Windows (installeur NSIS) et macOS (dmg universel Intel + Apple Silicon),
# les attache à la release GitHub et génère latest.json, lu par le bouton « Mettre à jour ».
# Actions épinglées par commit (pas par tag déplaçable) : elles voient la clé de signature.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-15-intel # Intel : les Mac arm64 de GitHub sont souvent saturés ; l'app reste universelle
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-15-intel' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Hangar ${{ github.ref_name }}
          releaseBody: "Télécharge Hangar-Setup.exe (Windows) ou le .dmg (macOS) ci-dessous. Les versions déjà installées se mettent à jour depuis Hangar."
          releaseDraft: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
      # Installeur Hangar : embarque le NSIS (toujours utilisé par l'updater), nom stable pour un lien direct.
      - name: installeur Hangar
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build:setup
          cp installer/target/release/hangar-setup.exe Hangar-Setup.exe
          gh release upload "${{ github.ref_name }}" Hangar-Setup.exe --clobber
